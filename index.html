<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Эти теги читает Threads/Telegram для превью ссылки, JS тут не помогает — правим руками -->
  <title>Работяга Studio — дизайнер</title>
  <meta name="description" content="Дизайнер: айдентика, соцсети, карусели, презентации, моушен и сайты.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Работяга Studio — дизайнер">
  <meta property="og:description" content="Айдентика, соцсети, карусели, презентации, моушен и сайты. Пишите в Telegram.">
  <meta property="og:image" content="https://rabotyagastudio.github.io/og.jpg">
  <meta property="og:url" content="https://rabotyagastudio.github.io/">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111110'/%3E%3Ctext x='32' y='45' font-family='Arial Black,Arial' font-weight='900' font-size='38' text-anchor='middle' fill='%23F3F1EC'%3EР%3C/text%3E%3Ccircle cx='50' cy='14' r='6' fill='%23FF4D1A'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#F3F1EC">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="penka.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#" data-site="name"></a>
    <nav class="nav">
      <a href="#works">Работы</a>
      <a href="#services">Услуги</a>
      <a href="#contact">Контакт</a>
    </nav>
    <a class="btn btn-sm" data-tg>Telegram</a>
  </header>

  <main>
    <section class="hero">
      <p class="status"><span class="dot"></span><span data-site="status"></span></p>
      <h1 data-site="headline"></h1>
      <p class="lead" data-site="lead"></p>
      <div class="hero-actions">
        <a class="btn" data-tg>Написать в Telegram</a>
        <a class="btn btn-ghost" href="#works">Смотреть работы</a>
      </div>
    </section>

    <div class="ticker" aria-hidden="true"><div class="ticker-track"></div></div>

    <section id="works" class="section">
      <div class="section-head">
        <h2>Работы</h2>
        <div class="filters"></div>
      </div>
      <div class="grid"></div>
    </section>

    <section id="services" class="section">
      <h2>Услуги</h2>
      <ol class="services"></ol>
    </section>

    <section id="contact" class="contact">
      <h2>Есть задача? Напишите.</h2>
      <p>Расскажите, что нужно, — обсудим сроки и цену.</p>
      <a class="btn btn-xl" data-tg></a>
    </section>
  </main>

  <footer class="foot">
    <span data-site="name"></span>
    <span id="year"></span>
  </footer>

  <dialog class="case" id="case">
    <div class="case-bar">
      <button class="btn btn-sm btn-ghost" data-close>✕ Закрыть</button>
      <button class="btn btn-sm btn-ghost" data-copy>Скопировать ссылку</button>
    </div>
    <div class="case-body"></div>
  </dialog>

  <dialog class="viewer" id="viewer" aria-label="Просмотр крупно">
    <div class="viewer-bar">
      <button class="btn btn-sm btn-ghost" data-back>← Назад ко всем</button>
      <p class="viewer-title"></p>
      <span class="viewer-count" aria-live="polite"></span>
    </div>
    <div class="viewer-stage"><img alt=""></div>
    <div class="viewer-nav">
      <button data-step="-1" aria-label="Предыдущая"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <button data-step="1" aria-label="Следующая"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
  </dialog>

  <dialog class="sv" id="series" aria-labelledby="sv-name">
    <header class="sv-head">
      <button class="btn btn-sm sv-back" data-sv-close><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span class="sv-back-text">Все серии</span></button>
      <nav class="sv-tabs" aria-label="Выбрать серию"></nav>
      <button class="sv-icon sv-x" data-sv-close aria-label="Закрыть просмотр"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="sv-body">
      <aside class="sv-info">
        <p class="sv-eyebrow"></p>
        <h2 class="sv-name" id="sv-name"></h2>
        <p class="sv-intro"></p>
        <a class="sv-link" data-tg>Обсудить мою задачу<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
      </aside>
      <div class="sv-stage">
        <button class="sv-icon sv-prev" aria-label="Предыдущий слайд"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <figure>
          <img alt="" draggable="false">
          <figcaption aria-live="polite"><span class="sv-cap"></span><span class="sv-count"></span></figcaption>
        </figure>
        <button class="sv-icon sv-next" aria-label="Следующий слайд"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="sv-strip" aria-label="Слайды серии"></div>
    <p class="sv-note" hidden></p>
  </dialog>

  <script src="data.js"></script>
  <script src="penka.js"></script>
  <script src="app.js"></script>
</body>
</html>
